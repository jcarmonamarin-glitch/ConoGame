<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5f8a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Juegos de Nael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Playwrite+ES:wght@400&display=swap">
<style>
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0}
/* Layout: cuaderno de 2.º — un mapa de misiones (una por aparato del cuerpo) y, dentro, una actividad cada vez con botones grandes para el dedo */
:root{
  --bg:#f3f6ee; --card:#ffffff; --ink:#1f2b24; --muted:#5a6a60; --line:#d8dfd0;
  --accent:#5f8a1f; --accent-ink:#ffffff;
  --ok:#2f9e5b; --ok-soft:#dcf3e4; --bad:#d6453d; --gap:#eef3ff; --gap-line:#7aa0e0;
  --c-cuerpo:#0f8f8a; --c-resp:#d4537a; --c-dig:#5f8a1f; --c-circ:#d23b3b; --c-exc:#c98a00; --c-sent:#7a4fc4; --c-loco:#2c6fd1; --c-final:#e07a12;
  --p1:#e0457b; --p2:#2c6fd1; --p3:#2f9e5b; --p4:#e07a12; --p5:#7a4fc4; --p6:#0f8f8a;
  --skin:#f4c3a4; --skin-line:#c98b6b;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-school:"Playwrite ES","Segoe Script","Comic Sans MS",cursive;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1c2420; --ink:#e6efe8; --muted:#9db0a4; --line:#2e3a33;
  --accent:#8cbf45; --accent-ink:#10160f;
  --ok:#4cc77e; --ok-soft:#1d3a29; --bad:#ff6b62; --gap:#1d2740; --gap-line:#6f95d8;
  --c-cuerpo:#2cc1b9; --c-resp:#f07aa0; --c-dig:#8cbf45; --c-circ:#ff6b6b; --c-exc:#f2b32e; --c-sent:#a987ee; --c-loco:#5d9bf2; --c-final:#ffa24a;
  --p1:#ff6fa0; --p2:#5d9bf2; --p3:#4cc77e; --p4:#ffa24a; --p5:#a987ee; --p6:#2cc1b9;
  --skin:#d9a283; --skin-line:#a56f52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1c2420; --ink:#e6efe8; --muted:#9db0a4; --line:#2e3a33;
  --accent:#8cbf45; --accent-ink:#10160f;
  --ok:#4cc77e; --ok-soft:#1d3a29; --bad:#ff6b62; --gap:#1d2740; --gap-line:#6f95d8;
  --c-cuerpo:#2cc1b9; --c-resp:#f07aa0; --c-dig:#8cbf45; --c-circ:#ff6b6b; --c-exc:#f2b32e; --c-sent:#a987ee; --c-loco:#5d9bf2; --c-final:#ffa24a;
  --p1:#ff6fa0; --p2:#5d9bf2; --p3:#4cc77e; --p4:#ffa24a; --p5:#a987ee; --p6:#2cc1b9;
  --skin:#d9a283; --skin-line:#a56f52; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.4;padding-inline:16px;padding-block:12px 40px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;background-attachment:local}
main{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gap-line);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}

/* HOME */
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:4px 20px}
.hrow{display:flex;align-items:center;gap:10px}
.eyebrow{flex:1;min-width:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hero h1{font-size:clamp(32px,9vw,52px);font-weight:800;color:var(--ink)}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:19px;font-weight:800}
.totals{align-self:flex-start;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;background:var(--card);border:3px solid #ffc21a;border-radius:999px;padding:4px 18px 4px 8px;font-variant-numeric:tabular-nums}
.totals svg{width:30px;height:30px}
.round{flex:none;width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.round svg{width:28px;height:28px}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.back{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;padding-top:8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px 14px;border-radius:24px;background:var(--card);border:3px solid var(--mc);box-shadow:0 6px 0 var(--mc);text-align:center;transition:transform .08s,box-shadow .08s}
.mcard:active{transform:translateY(5px);box-shadow:0 1px 0 var(--mc)}
.mcard .ic{flex:none;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--mc);color:#fff}
.mcard .ic svg{width:40px;height:40px}
.mcard .tx{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mcard .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(19px,5.2vw,22px);line-height:1.05;color:var(--ink)}
.mcard .sub{font-size:13px;color:var(--muted);line-height:1.2;font-weight:700}
.stars{display:flex;gap:2px;justify-content:center}
.stars svg{width:26px;height:26px}
.mcard.final{grid-column:1/-1;flex-direction:row;justify-content:center;gap:16px;padding:18px 16px 16px}
.mcard.final .tx{align-items:flex-start;text-align:left}
.grid>.mcard:nth-child(7){grid-column:1/-1;flex-direction:row;justify-content:center;gap:16px;padding:18px 16px 16px}
.grid>.mcard:nth-child(7) .tx{align-items:flex-start;text-align:left}
@media (min-width:640px){.mcard.final,.grid>.mcard:nth-child(7){grid-column:auto;flex-direction:column;padding:18px 8px 14px;gap:8px}.mcard.final .tx,.grid>.mcard:nth-child(7) .tx{align-items:center;text-align:center}}
.badge{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:#ffc21a;color:#3a2a00;font-family:var(--f-display);font-weight:800;font-size:15px;padding:2px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 #c48f00;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.parents{margin-top:28px;font-size:15px;color:var(--muted);background:var(--card);border-radius:var(--r);padding:12px 14px;border:2px solid var(--line)}
.parents summary{font-weight:800;cursor:pointer;color:var(--ink)}
.parents p{margin:8px 0 0}

/* MISSION */
#app.mission{padding-bottom:130px}
.top{display:flex;align-items:center;gap:12px;padding-block:2px 14px}
.mtitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.mname{font-family:var(--f-display);font-size:19px;font-weight:800;color:var(--mc);line-height:1.1}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mc);border-radius:inherit;transition:width .5s}
.panel{background:var(--card);border-radius:22px;border:3px solid var(--mc);padding:18px 14px 22px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;gap:10px;align-items:center}
.qhead h2{font-size:clamp(22px,6vw,28px);flex:1;min-width:0}
.hint{margin:-6px 0 0;color:var(--muted);font-size:17px;font-weight:700}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:4px solid var(--ok);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgb(0 0 0 / .12);animation:up .3s ease-out}
.nextbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
@keyframes up{from{transform:translateY(100%)}}
.praise{flex:1;min-width:0;font-family:var(--f-display);font-size:clamp(20px,5.6vw,26px);font-weight:800;color:var(--ok);line-height:1.1}
.next{flex:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 26px;font-family:var(--f-display);font-weight:800;font-size:22px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .08s}
.next:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.ghost:active{box-shadow:0 1px 0 var(--line)}
.modal{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--card);border-radius:24px;padding:24px 18px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.mbox .next{width:100%}

/* generic choice buttons */
.opt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-weight:800;font-size:20px;min-height:58px;text-align:center;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
@media (hover:hover){.opt:hover{border-color:var(--mc)}}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.no{opacity:.35;text-decoration:line-through;box-shadow:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}

/* match */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(40px,14vw,140px)}
.match .col{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;min-width:0}
.mi{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:10px;font-weight:800;font-size:18px;min-height:58px;overflow-wrap:break-word;hyphens:auto;box-shadow:0 3px 0 var(--line)}
@media (max-width:420px){.mi{font-size:16px;padding:8px 6px}}
.mi.sel{border-color:var(--gap-line);background:var(--gap);transform:scale(1.04)}
.mi.ok{border-color:var(--pc);color:var(--pc)}
.mi .em{display:block;font-size:26px;line-height:1.1}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}

/* fill */
.sents{display:flex;flex-direction:column;gap:14px}
.sents p{margin:0;font-family:var(--f-school);font-size:clamp(19px,4.6vw,24px);line-height:2}
.gap{display:inline-block;min-width:5.5em;border-bottom:3px dashed var(--gap-line);background:var(--gap);border-radius:6px 6px 0 0;padding:0 8px;text-align:center;font-family:var(--f-body);font-weight:800;line-height:1.5}
.gap.cur{animation:blink 1.1s infinite}
.gap.filled{border-bottom-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok);animation:none}
@keyframes blink{50%{background:transparent}}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.bank .opt{flex:1 1 auto;min-width:6em}
.bank .opt.used{visibility:hidden}

/* order */
.order{display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:800;font-size:18px}
.ocard .box{flex:none;width:42px;height:42px;border:3px solid var(--muted);border-radius:8px;display:grid;place-items:center;font-family:var(--f-school);font-size:22px}
.ocard.ok{border-color:var(--ok);background:var(--ok-soft)}
.ocard.ok .box{border-color:var(--ok);color:var(--ok)}

/* sort */
.now{align-self:stretch;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,40px);padding:10px 30px;border-radius:18px;background:var(--gap);border:3px dashed var(--gap-line);text-align:center}
.buckets{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.buckets{grid-template-columns:repeat(var(--n),minmax(0,1fr))}}
.bucket{display:flex;flex-direction:column;gap:8px;align-items:stretch;border:3px solid var(--mc);background:var(--card);border-radius:16px;padding:12px;min-height:66px;box-shadow:0 4px 0 var(--mc);text-align:center}
.bucket b{font-family:var(--f-display);font-size:21px;color:var(--mc);line-height:1.1}
@media (max-width:559px){.bucket{flex-direction:row;align-items:center;text-align:left}.bucket b{flex:none;width:6.5em}.bucket .chips{justify-content:flex-start;flex:1}}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chips span{font-size:14px;font-weight:800;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:2px 9px}
.count{font-size:14px;color:var(--muted);text-align:center}

/* quiz */
.qtext{font-size:clamp(20px,5vw,24px);font-weight:800;margin:0}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:520px){.opts{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}}
.opts.two{grid-template-columns:1fr 1fr}
.diagram{display:flex;justify-content:center}
.diagram svg{width:min(240px,70vw);height:auto}
.dot circle{fill:var(--card);stroke:var(--ink);stroke-width:2.5}
.dot text{font:800 12px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.dot.cur circle{fill:#ffd23f;stroke:var(--ink);animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
.dot.done circle{fill:var(--ok)} .dot.done text{fill:#fff}
@keyframes pulse{50%{transform:scale(1.25)}}

/* pulse */
.heartwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.heart{width:120px;height:120px;color:var(--c-circ)}
.heart.beat{animation:beat .85s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(.97)}45%{transform:scale(1.1)}}
.clock{font-family:var(--f-display);font-weight:800;font-size:46px;font-variant-numeric:tabular-nums}

/* build */
.build{display:flex;flex-direction:column;gap:18px;align-items:center}
.bpic{font-size:68px;line-height:1}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{min-width:46px;height:58px;padding:0 8px;border-bottom:4px solid var(--gap-line);background:var(--gap);border-radius:8px 8px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px}
.slot.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt.tile{min-width:60px;height:62px;padding:0 14px;font-family:var(--f-display);font-size:28px}
.opt.tile.used{visibility:hidden}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(58px,1fr))}
.opts.row .opt{font-family:var(--f-display);font-size:24px}
.small .gap{min-width:1.8em;padding:0 4px}
a.round{text-decoration:none}
.pic svg{max-width:100%;height:auto}
.hund{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;width:100%;max-width:460px;margin:0 auto}
.hc{aspect-ratio:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;font-family:var(--f-body);font-weight:800;font-size:clamp(12px,3.7vw,18px);padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.hc.blank{background:var(--gap);border:2px dashed var(--gap-line);color:var(--gap-line)}
.hc.cur{animation:blink 1.1s infinite;box-shadow:0 0 0 3px var(--gap-line)}
.hc.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bank.small{justify-content:center}
.bank.small .opt{flex:0 0 auto;min-width:60px;font-family:var(--f-display);font-size:26px}

/* end */
.end{text-align:center;align-items:center}
.end .big{display:flex;gap:6px;justify-content:center}
.end .big svg{width:62px;height:62px}
.end .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.soundt{margin-left:auto}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- menú de asignaturas ---------- */
.subjects{display:grid;grid-template-columns:1fr;gap:18px;padding-top:6px}
@media (min-width:640px){.subjects{grid-template-columns:repeat(3,minmax(0,1fr))}}
.subj{display:flex;align-items:center;gap:16px;padding:18px;border-radius:26px;background:var(--card);border:3px solid var(--c);box-shadow:0 7px 0 var(--c);color:var(--ink);text-decoration:none;transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.subj:active{transform:translateY(6px);box-shadow:0 1px 0 var(--c)}
.subj:focus-visible{outline:3px solid var(--c);outline-offset:3px}
@media (min-width:640px){.subj{flex-direction:column;text-align:center}}
.subj .ic{flex:none;width:78px;height:78px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.subj .ic svg{width:44px;height:44px}
.subj .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.subj .kind{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.subj .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(23px,6.4vw,27px);line-height:1.05}
.stars.sm{align-items:center;gap:6px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;justify-content:flex-start}
@media (min-width:640px){.subj .stars.sm{justify-content:center}}
/* ---------- tema y dificultad ---------- */
.sect{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0}
.sectrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;margin-bottom:10px}
.hero+.sect{margin-bottom:10px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:18px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--ink);transition:transform .08s}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .lvi{color:var(--lc);display:block;line-height:0}
.lv .lvi svg{width:34px;height:20px}
.lv small{font-family:var(--f-body);font-size:12px;line-height:1.15;color:var(--muted);font-weight:700;text-align:center}
.lv[aria-pressed="true"]{border-color:var(--lc);box-shadow:0 4px 0 var(--lc);background:color-mix(in srgb,var(--lc) 14%,var(--card))}
.lvchip{display:inline-block;font-size:13px;font-family:var(--f-body);font-weight:800;color:#fff;background:var(--lc);border-radius:999px;padding:1px 9px;vertical-align:2px}

/* ---------- código de animales ---------- */
.savebox{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.saverow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.saverow .next{font-size:18px;padding:12px 10px}
.hubcode{margin-top:26px;align-self:center}
.mbox{max-height:calc(100vh - 32px);overflow:auto}
.code{display:flex;gap:6px;justify-content:center}
.code span{flex:0 1 48px;height:56px;border-radius:12px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-size:32px;line-height:1}
.code.empty span{background:var(--gap);border:2px dashed var(--gap-line)}
.code.empty span.cur{animation:blink 1.1s infinite}
.codenames{margin:0;font-size:15px;font-weight:700;color:var(--muted)}
.zoo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.zoo button{aspect-ratio:1;font-size:34px;line-height:1;border-radius:14px;border:3px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);padding:0}
.zoo button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.err{margin:0;color:var(--bad);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ok);color:#fff;font-family:var(--f-display);font-weight:800;font-size:20px;padding:10px 20px;border-radius:999px;box-shadow:0 6px 20px rgb(0 0 0 / .2);max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main id="app"></main>
<script src="temario/indice.js"></script>
<script>
/* ======================================================================
   Motor de los juegos de Nael. Todo lo común vive aquí.
   - Sin ?a=  → menú de asignaturas (lista en temario/indice.js)
   - ?a=<id>  → carga temario/<archivo>.js, que llama a registrar({...})
   ====================================================================== */
const params=new URLSearchParams(location.search),ASIG=params.get('a');
let T=null,LV=2,ICONS={},DIAGRAMS={},DIAG_VIEW={},MISSIONS=[],FINAL=null;
const NS='http://www.w3.org/2000/svg';
const HUB_ICONS={final:'<path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z"/>'};
const icon=(k,sw=2.2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const starSvg=on=>`<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z" fill="${on?'#ffc21a':'none'}" stroke="${on?'#e09a00':'var(--line)'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* ---------- utilidades ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==='html')e.innerHTML=attrs[k];else if(k.startsWith('on'))e[k]=attrs[k];else e.setAttribute(k,attrs[k])}kids.forEach(c=>c!=null&&e.append(c));return e}
function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
function pop(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
let soundOn=true;try{soundOn=localStorage.getItem('nael-sonido')!=='0'}catch(e){}
let ac=null;
function tone(fs,dur=.12,type='triangle'){if(!soundOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;fs.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);t+=dur*.9})}catch(e){}}
let mistakes=0;
const good=()=>tone([660,880]);
const bad=()=>{mistakes++;tone([220,180],.15,'sine')};
const canSpeak='speechSynthesis' in window;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,''));u.lang='es-ES';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const PRAISE=['¡Muy bien, Nael!','¡Genial!','¡Eres un crack!','¡Perfecto!','¡Así se hace!','¡Lo sabes todo!'];
let redraw=null;window.addEventListener('resize',()=>redraw&&redraw());

/* ---------- pantallas ---------- */
const app=document.getElementById('app');
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>';
const HOME_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>';
/* ---------- niveles y progreso ---------- */
const LVINFO={1:{k:'f',name:'Fácil',sub:'Menos preguntas',c:'var(--p3)'},2:{k:'n',name:'Normal',sub:'Como en clase',c:'var(--p2)'},3:{k:'d',name:'Difícil',sub:'Sin pistas',c:'var(--p1)'}};
const STAR_TH={1:[3,8],2:[2,6],3:[1,4]}; // fallos máximos para 3 y 2 estrellas
const lvIcon=n=>`<svg viewBox="0 0 34 20" aria-hidden="true">${[0,1,2].map(i=>`<rect x="${i*12+1}" y="${13-i*6}" width="9" height="${6+i*6}" rx="2" style="fill:${i<n?'currentColor':'var(--line)'}"/>`).join('')}</svg>`;
function readProg(key){let p={};try{p=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}
  if(!p.f&&!p.n&&!p.d&&Object.keys(p).length)p={n:p}; // progreso antiguo, sin niveles = Normal
  return {f:p.f||{},n:p.n||{},d:p.d||{}}}
const store={get(){return readProg(T.storeKey)[LVINFO[LV].k]},
  set(v){const all=readProg(T.storeKey);all[LVINFO[LV].k]=v;try{localStorage.setItem(T.storeKey,JSON.stringify(all))}catch(e){}}};
function loadLevel(){try{const v=+localStorage.getItem(T.storeKey+'-nivel');if(v>=1&&v<=3)LV=v}catch(e){}}
function saveLevel(){try{localStorage.setItem(T.storeKey+'-nivel',String(LV))}catch(e){}}
function applyLevel(list){return list.map(a0=>{const a={...a0};
  if(LV===1){
    if(a.type==='quiz')a.items=a.items.slice(0,Math.max(2,Math.ceil(a.items.length*.6))).map(it=>{
      if(!it.opts||it.keep||it.opts.length<=2)return it;
      const others=it.opts.filter((_,i)=>i!==it.a);return {...it,opts:[it.opts[it.a],others[Math.random()*others.length|0]],a:0}});
    if(a.type==='sort'){const cap={},used={};a.buckets.forEach(b=>cap[b]=Math.max(2,Math.ceil(a.items.filter(x=>x[1]===b).length*.6)));
      a.items=shuffle(a.items).filter(([,b])=>(used[b]=(used[b]||0)+1)<=cap[b])}
    if(a.type==='build')a.items=a.items.slice(0,3);
    if(a.type==='match'&&a.pairs.length>4)a.pairs=a.pairs.slice(0,4);
    if(a.type==='fill')a.extra=[];
  }
  if(LV===3)delete a.hint;
  return a})}

/* ---------- menús ---------- */
const BACK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
function soundBtn(){const b=h('button',{class:'round','aria-label':'Sonido',html:soundOn?SND_ON:SND_OFF});
  b.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('nael-sonido',soundOn?'1':'0')}catch(e){}b.innerHTML=soundOn?SND_ON:SND_OFF;if(soundOn)good()};return b}
function hub(){
  redraw=null;app.className='';app.innerHTML='';document.title='Juegos de Nael';
  app.append(h('header',{class:'hero'},h('div',{class:'hrow'},h('span',{class:'eyebrow'},'Repaso de 2.º de Primaria'),soundBtn()),
    h('h1',{html:'¡Hola, <span>Nael!</span>'}),h('p',{},'¿Qué quieres repasar hoy?')));
  const list=h('nav',{class:'subjects'});
  SUBJECTS.forEach(s=>{const all=readProg(s.storeKey);const n=['f','n','d'].reduce((t,k)=>t+Object.values(all[k]).reduce((a,b)=>a+b,0),0);
    list.append(h('a',{class:'subj',href:`base.html?a=${s.id}`,style:`--c:${s.color}`},
      h('span',{class:'ic',html:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg>`}),
      h('span',{class:'tx'},h('span',{class:'kind'},s.kind),h('span',{class:'nm'},s.name),h('span',{class:'stars sm',html:starSvg(true)+`<span>${n} estrellas</span>`}))))});
  app.append(list,h('div',{class:'savebox'},h('button',{class:'next ghost hubcode',onclick:showLoad},'Tengo un código de animales')));window.scrollTo(0,0);
}
function home(){
  redraw=null;app.className='';document.title=T.title;
  const prog=store.get(),all=[...MISSIONS,FINAL];
  const total=all.reduce((n,m)=>n+(prog[m.id]||0),0),nextM=all.find(m=>!prog[m.id]);
  app.innerHTML='';
  app.append(h('header',{class:'hero'},
    h('div',{class:'hrow'},h('a',{class:'round',href:'base.html','aria-label':'Volver a las asignaturas',html:BACK_SVG}),h('span',{class:'eyebrow'},T.eyebrow),soundBtn()),
    h('h1',{html:T.h1})));
  const lv=h('div',{class:'levels',role:'group','aria-label':'Dificultad'});
  [1,2,3].forEach(n=>{const I=LVINFO[n];
    lv.append(h('button',{class:'lv',style:`--lc:${I.c}`,'aria-pressed':String(n===LV),onclick(){if(LV!==n){LV=n;saveLevel();good();home()}}},
      h('span',{class:'lvi',html:lvIcon(n)}),h('span',{},I.name),h('small',{},I.sub)))});
  app.append(h('h2',{class:'sect'},'1. Elige la dificultad'),lv,
    h('div',{class:'sectrow'},h('h2',{class:'sect'},'2. Elige un tema'),h('div',{class:'totals',html:starSvg(true)+`<span>${total} de ${all.length*3}</span>`})));
  const g=h('div',{class:'grid'});
  all.forEach(m=>{
    const st=prog[m.id]||0,fin=m===FINAL;
    const b=h('button',{class:'mcard'+(fin?' final':''),style:`--mc:${m.color}`,onclick(){start(m)}},
      h('span',{class:'ic',html:icon(fin?'final':m.id)}),
      h('span',{class:'tx'},h('span',{class:'nm'},m.name),h('span',{class:'sub'},m.sub),
        h('span',{class:'stars',html:[1,2,3].map(n=>starSvg(n<=st)).join('')})));
    if(m===nextM)b.append(h('span',{class:'badge'},total?'¡Sigue aquí!':'¡Empieza aquí!'));
    g.append(b);
  });
  app.append(g,h('section',{class:'savebox'},h('h2',{class:'sect'},'Guarda tus estrellas'),
    h('div',{class:'saverow'},h('button',{class:'next',onclick:showSave},'Ver mi código'),h('button',{class:'next ghost',onclick:showLoad},'Tengo un código'))),
    h('details',{class:'parents'},h('summary',{},'Para papá y mamá'),
    h('p',{},'Fácil: menos preguntas y solo dos opciones para elegir. Normal: como en clase. Difícil: todas las preguntas y sin pistas (en Matemáticas, además, números más grandes y más parecidos). Cada dificultad guarda sus propias estrellas en este dispositivo.'),
    h('button',{class:'back',style:'margin-top:10px',onclick(){try{localStorage.removeItem(T.storeKey)}catch(e){}home()}},'Borrar las estrellas de esta asignatura')));
  window.scrollTo(0,0);
}

let M,acts,idx;
function start(m){M=m;acts=applyLevel(m.build?m.build(LV):m.acts);idx=0;mistakes=0;render()}
function render(){
  redraw=null;app.className='mission';app.innerHTML='';
  const a=acts[idx];
  const fill=h('i',{style:`width:${idx/acts.length*100}%`});
  app.append(h('div',{class:'top',style:`--mc:${M.color}`},
    h('button',{class:'round','aria-label':'Volver al mapa',html:HOME_SVG,onclick:askExit}),
    h('div',{class:'mtitle'},h('span',{class:'mname'},`${M.name} · ${idx+1} de ${acts.length} `,h('span',{class:'lvchip',style:`--lc:${LVINFO[LV].c}`},LVINFO[LV].name)),h('div',{class:'bar'},fill))));
  const panel=h('section',{class:'panel',style:`--mc:${M.color}`});
  const head=h('div',{class:'qhead'},h('h2',{},a.title));
  if(canSpeak)head.append(h('button',{class:'round','aria-label':'Escuchar',onclick(){speak(a.title+'. '+(a.hint||''))},html:SND_ON}));
  panel.append(head);
  if(a.hint)panel.append(h('p',{class:'hint'},a.hint));
  const body=h('div');panel.append(body);
  const bar=h('div',{class:'nextbar',hidden:''});
  app.append(panel,bar);
  const done=()=>{tone([523,659,784,1047],.11);fill.style.width=`${(idx+1)/acts.length*100}%`;bar.innerHTML='';
    bar.append(h('div',{class:'in'},h('span',{class:'praise'},PRAISE[Math.random()*PRAISE.length|0]),
      h('button',{class:'next',onclick(){idx++;idx<acts.length?render():finish()}},idx<acts.length-1?'Siguiente →':'¡Terminar!')));
    bar.hidden=false};
  ({match:actMatch,fill:actFill,order:actOrder,sort:actSort,quiz:actQuiz,label:actLabel,pulse:actPulse,build:actBuild,grid:actGrid})[a.type](a,body,done);
  window.scrollTo(0,0);
}

function askExit(){
  const m=h('div',{class:'modal',onclick(e){if(e.target===m)m.remove()}},
    h('div',{class:'mbox'},h('h2',{},'¿Quieres salir?'),
      h('p',{class:'hint',style:'margin:0'},'Si sales ahora, esta misión empezará otra vez desde el principio.'),
      h('button',{class:'next ghost',onclick(){m.remove()}},'No, sigo jugando'),
      h('button',{class:'next',onclick(){m.remove();home()}},'Sí, volver al mapa')));
  document.body.append(m);
}

function finish(){
  redraw=null;app.className='';
  const th=STAR_TH[LV],stars=mistakes<=th[0]?3:mistakes<=th[1]?2:1;
  const prog=store.get();prog[M.id]=Math.max(prog[M.id]||0,stars);store.set(prog);
  app.innerHTML='';
  const msg=stars===3?'¡Increíble! Casi sin fallos.':stars===2?'¡Muy bien! Si repites, seguro que sacas 3 estrellas.':'¡Bien hecho! Vamos a repetirla para aprenderla mejor.';
  app.append(h('section',{class:'panel end',style:`--mc:${M.color}`},
    h('h2',{},'¡Misión superada!'),
    h('div',{class:'big',html:[1,2,3].map(n=>starSvg(n<=stars)).join('')}),
    h('p',{class:'qtext'},msg),
    h('div',{class:'btns'},h('button',{class:'next',onclick:home},'Volver al mapa'),h('button',{class:'next ghost',onclick(){start(M)}},'Repetir'))));
  confetti();tone([523,659,784,1047,1319],.13);window.scrollTo(0,0);
}

/* ---------- actividades ---------- */
const PCOL=['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)','var(--p6)'];
function itemLabel(t){const m=t.match(/^(\S+)\s(.+)$/);if(m&&/\p{Extended_Pictographic}/u.test(m[1])){const f=document.createDocumentFragment();f.append(h('span',{class:'em'},m[1]),m[2]);return f}return t}
function actMatch(a,box,done){
  const wrap=h('div',{class:'match'}),L=h('div',{class:'col'}),R=h('div',{class:'col'});
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','lines');
  wrap.append(svg,L,R);box.append(wrap);
  let sel=null,made=[];
  const mk=(o,side,col)=>{const b=h('button',{class:'mi'},itemLabel(o.t));b.onclick=()=>pick(o,side,b);col.append(b)};
  shuffle(a.pairs.map((p,i)=>({t:p[0],i}))).forEach(o=>mk(o,'l',L));
  let rs;do{rs=shuffle(a.pairs.map((p,i)=>({t:p[1],i})))}while(a.pairs.length>2&&rs.every((o,k)=>o.i===k));
  rs.forEach(o=>mk(o,'r',R));
  function pick(o,side,b){
    if(b.classList.contains('ok'))return;
    if(!sel||sel.side===side){if(sel)sel.b.classList.remove('sel');sel={o,side,b};b.classList.add('sel');return}
    const s=sel;sel=null;s.b.classList.remove('sel');
    if(s.o.i===o.i){const c=PCOL[made.length%PCOL.length];[b,s.b].forEach(x=>{x.classList.add('ok');x.style.setProperty('--pc',c);pop(x)});
      made.push(side==='l'?[b,s.b,c]:[s.b,b,c]);draw();good();if(made.length===a.pairs.length)done()}
    else{bad();shake(b);shake(s.b)}
  }
  function draw(){const r=wrap.getBoundingClientRect();svg.innerHTML='';
    made.forEach(([l,rt,c])=>{const A=l.getBoundingClientRect(),B=rt.getBoundingClientRect();
      const x1=A.right-r.left+2,y1=A.top+A.height/2-r.top,x2=B.left-r.left-3,y2=B.top+B.height/2-r.top;
      const ang=Math.atan2(y2-y1,x2-x1),k=11;
      const p=(dx,dy)=>`${x2+dx*Math.cos(ang)-dy*Math.sin(ang)},${y2+dx*Math.sin(ang)+dy*Math.cos(ang)}`;
      svg.insertAdjacentHTML('beforeend',`<line x1="${x1}" y1="${y1}" x2="${x2-6*Math.cos(ang)}" y2="${y2-6*Math.sin(ang)}" style="stroke:${c}" stroke-width="4" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="5" style="fill:${c}"/><polygon points="${p(0,0)} ${p(-k,-6)} ${p(-k,6)}" style="fill:${c}"/>`)})}
  redraw=draw;
}
function actFill(a,box,done){
  const sents=h('div',{class:'sents'+(a.small?' small':'')}),gaps=[];
  a.lines.forEach(line=>{const p=h('p');line.split(/(\[[^\]]+\])/).forEach(part=>{if(!part)return;if(part[0]==='['){const g=h('span',{class:'gap'},' ');g.dataset.a=part.slice(1,-1);gaps.push(g);p.append(g)}else p.append(part)});sents.append(p)});
  const bank=h('div',{class:'bank'+(a.small?' small':'')});let cur=0;gaps[0].classList.add('cur');
  shuffle([...gaps.map(g=>g.dataset.a),...(a.extra||[])]).forEach(w=>{
    const b=h('button',{class:'opt',onclick(){
      if(w===gaps[cur].dataset.a){const g=gaps[cur];g.textContent=w;g.classList.remove('cur');g.classList.add('filled');pop(g);b.classList.add('used');b.disabled=true;good();
        cur++;if(cur<gaps.length)gaps[cur].classList.add('cur');else{bank.querySelectorAll('.opt:not(.used)').forEach(x=>x.disabled=true);done()}}
      else{bad();shake(b)}}},w);bank.append(b)});
  box.append(h('div',{class:'sents',style:'gap:18px'},sents,h('p',{class:'hint',style:'margin:0'},'Toca lo que va en el hueco que parpadea.'),bank));
}
function actOrder(a,box,done){
  const wrap=h('div',{class:'order'});let next=0;
  let it;do{it=shuffle(a.items.map((t,i)=>({t,i})))}while(it.every((o,k)=>o.i===k));
  it.forEach(o=>{const bx=h('span',{class:'box'});const b=h('button',{class:'ocard',onclick(){
    if(b.classList.contains('ok'))return;
    if(o.i===next){next++;bx.textContent=next;b.classList.add('ok');pop(b);good();if(next===a.items.length)done()}else{bad();shake(b)}}},bx,h('span',{},o.t));wrap.append(b)});
  box.append(wrap);
}
function actSort(a,box,done){
  const q=shuffle(a.items);let k=0;
  const now=h('div',{class:'now'},q[0][0]);const count=h('div',{class:'count'});
  const bs=h('div',{class:'buckets',style:`--n:${a.buckets.length}`});
  const upd=()=>count.textContent=`Quedan ${q.length-k}`;upd();
  a.buckets.forEach(name=>{const chips=h('div',{class:'chips'});const b=h('button',{class:'bucket',onclick(){
    if(k>=q.length)return;
    if(q[k][1]===name){chips.append(h('span',{},q[k][0]));pop(b);good();k++;upd();
      if(k<q.length){now.textContent=q[k][0];pop(now)}else{now.textContent='¡Todo colocado!';done()}}
    else{bad();shake(b)}}},h('b',{},name),chips);bs.append(b)});
  box.append(h('div',{class:'sents'},now,count,bs));
}
function quizEngine(items,box,done,opts){
  let k=0;const q=h('p',{class:'qtext',style:'cursor:pointer'});const os=h('div',{class:'opts'}),pic=h('div',{class:'diagram pic',hidden:''});q.onclick=()=>speak(q.textContent);
  const wrap=h('div',{class:'sents'});if(opts&&opts.top)wrap.append(opts.top);wrap.append(pic,q,os);box.append(wrap);
  function show(){const it=items[k];if(opts&&opts.onShow)opts.onShow(k);pic.innerHTML=it.pic||'';pic.hidden=!it.pic;q.textContent=it.q;os.innerHTML='';os.className='opts'+(it.tf!==undefined||(opts&&opts.two)?' two':'')+(it.row?' row':'');
    const choices=it.tf!==undefined?['Verdadero','Falso']:it.opts;const ans=it.tf!==undefined?(it.tf?0:1):it.a;
    const order=it.tf!==undefined||it.keep?choices.map((c,i)=>i):shuffle(choices.map((c,i)=>i));
    let locked=false;
    order.forEach(i=>{const b=h('button',{class:'opt',onclick(){if(locked||b.classList.contains('no'))return;
      if(i===ans){locked=true;b.classList.add('ok');pop(b);good();if(opts&&opts.onRight)opts.onRight(k);
        setTimeout(()=>{k++;k<items.length?show():(os.querySelectorAll('.opt').forEach(x=>x.disabled=true),done())},750)}
      else{bad();shake(b);b.classList.add('no')}}},choices[i]);os.append(b)})}
  show();
}
function actQuiz(a,box,done){
  const items=a.items.map(it=>it.opts?it:{q:it.q,tf:it.a});
  quizEngine(items,box,done);
}
function actLabel(a,box,done){
  const svg=`<svg viewBox="${DIAG_VIEW[a.diagram]}" role="img" aria-label="Dibujo">${DIAGRAMS[a.diagram]}${a.points.map((p,i)=>`<g class="dot" id="d${i}"><circle cx="${p[0]}" cy="${p[1]}" r="11"/><text x="${p[0]}" y="${p[1]}">${i+1}</text></g>`).join('')}</svg>`;
  const top=h('div',{class:'diagram',html:svg});
  const items=a.points.map((p,i)=>({q:`¿Cómo se llama el número ${i+1}?`,opts:a.opts,a:a.opts.indexOf(p[2])}));
  quizEngine(items,box,done,{top,two:true,
    onShow(k){top.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('cur',i===k))},
    onRight(k){const d=top.querySelector('#d'+k);d.classList.remove('cur');d.classList.add('done')}});
}
function actPulse(a,box,done){
  const heart=h('div',{class:'heart',html:icon('circ',1.6).replace('fill="none"','fill="currentColor"')});
  const clock=h('div',{class:'clock'},'1:00');
  const txt=h('p',{class:'qtext',style:'text-align:center'},'Pon dos dedos en tu muñeca, como en el libro. Cuenta los latidos durante 1 minuto. ¡Pide ayuda a papá!');
  const res=h('p',{class:'hint',style:'text-align:center;margin:0'},'');
  let t=null;
  const go=h('button',{class:'next',style:'margin:0',onclick(){
    if(t)return;let s=60;heart.classList.add('beat');go.textContent='Contando…';
    t=setInterval(()=>{s--;clock.textContent=`0:${String(s).padStart(2,'0')}`;
      if(s<=0){clearInterval(t);t=null;heart.classList.remove('beat');tone([880,880,880],.2);clock.textContent='¡Tiempo!';
        go.textContent='Otra vez';res.textContent='Ahora salta 20 veces y vuelve a contar. ¿Late más rápido o más despacio? (¡Más rápido!)';done()}},1000)}},'Empezar');
  const skip=h('button',{class:'back',onclick(){if(t){clearInterval(t);t=null}heart.classList.remove('beat');done()}},'Saltar');
  box.append(h('div',{class:'heartwrap'},heart,clock,txt,h('div',{style:'display:flex;gap:10px;align-items:center'},go,skip),res));
}

function actBuild(a,box,done){
  let k=0;const wrap=h('div',{class:'build'});box.append(wrap);
  function show(){const it=a.items[k],P=it.p;wrap.innerHTML='';
    const slots=P.map(()=>h('span',{class:'slot'},'\u00a0'));let n=0;
    const tiles=h('div',{class:'tiles'});
    let ord;do{ord=shuffle(P.map((t,i)=>({t,i})))}while(P.length>1&&ord.every((o,j)=>P[j]===o.t));
    ord.forEach(o=>{const b=h('button',{class:'opt tile'},o.t);b.onclick=()=>{
      if(b.disabled)return;
      if(o.t===P[n]){slots[n].textContent=o.t;slots[n].classList.add('on');pop(slots[n]);b.classList.add('used');b.disabled=true;n++;good();
        if(n===P.length){if(canSpeak&&soundOn)speak(P.join(''));setTimeout(()=>{k++;k<a.items.length?show():done()},1000)}}
      else{bad();shake(b)}};tiles.append(b)});
    wrap.append(h('div',{class:'bpic'},it.e),h('div',{class:'slots'},...slots),tiles,h('div',{class:'count'},`${k+1} de ${a.items.length}`));
  }
  show();
}

function actGrid(a,box,done){
  const g=h('div',{class:'hund'}),cells=[],pick=a.mode==='pick';
  for(let n=0;n<100;n++){const c=h(pick?'button':'span',{class:'hc'},String(n));cells.push(c);g.append(c)}
  if(pick){
    const info=h('div',{class:'count'});let left=0;
    cells.forEach((c,n)=>{const ok=a.test(n);if(ok)left++;
      c.onclick=()=>{if(c.classList.contains('on'))return;
        if(ok){c.classList.add('on');pop(c);good();left--;info.textContent=left?`Quedan ${left}`:'¡Todos!';if(!left){cells.forEach(x=>x.disabled=true);done()}}
        else{bad();shake(c)}}});
    info.textContent=`Quedan ${left}`;box.append(h('div',{class:'sents'},g,info));
  }else{
    const B=a.blanks;let cur=0;
    B.forEach(n=>{cells[n].textContent='?';cells[n].classList.add('blank')});cells[B[0]].classList.add('cur');
    const bank=h('div',{class:'bank small'}),extra=[];
    while(extra.length<2){const v=Math.floor(Math.random()*100);if(!B.includes(v)&&!extra.includes(v))extra.push(v)}
    shuffle([...B,...extra]).forEach(n=>{const b=h('button',{class:'opt'},String(n));b.onclick=()=>{
      if(n===B[cur]){const c=cells[n];c.textContent=n;c.classList.remove('blank','cur');c.classList.add('on');pop(c);b.classList.add('used');b.disabled=true;good();cur++;
        if(cur<B.length)cells[B[cur]].classList.add('cur');else{bank.querySelectorAll('.opt:not(.used)').forEach(x=>x.disabled=true);done()}}
      else{bad();shake(b)}};bank.append(b)});
    box.append(h('div',{class:'sents'},g,bank));
  }
}

/* ---------- confeti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff5c8a','#3d8bff','#38c172','#ffb020','#9b6bff','#ffd23f'];
  const ps=Array.from({length:140},()=>({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<150)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}


/* ---------- código de animales (guardar y recuperar estrellas) ----------
   6 animales de 16 = 24 bits: asignatura (2) + nivel (2) + estrellas de 8 temas (2 cada uno) + control (4).
   La asignatura es su posición en SUBJECTS; los temas, el orden de MISSIONS + FINAL. */
const ANIMALS=[['🐶','perro'],['🐱','gato'],['🐭','ratón'],['🐰','conejo'],['🦊','zorro'],['🐻','oso'],['🐼','panda'],['🐨','koala'],
  ['🐯','tigre'],['🦁','león'],['🐮','vaca'],['🐷','cerdo'],['🐸','rana'],['🐵','mono'],['🐔','gallina'],['🐧','pingüino']];
const CODE_MASK=0x5A3C9;
const codeSum=n=>n.slice(0,5).reduce((t,v,i)=>t+(i+3)*v,7)&15;
function encodeCode(si,lv,stars){let d=((si&3)<<18)|((lv&3)<<16);stars.slice(0,8).forEach((v,i)=>d|=(v&3)<<(2*i));d^=CODE_MASK;
  const n=[0,1,2,3,4].map(i=>(d>>(4*(4-i)))&15);return [...n,codeSum(n)]}
function decodeCode(n){if(n.length!==6||codeSum(n)!==n[5])return null;
  const d=n.slice(0,5).reduce((t,v)=>t*16+v,0)^CODE_MASK,si=(d>>18)&3,lv=(d>>16)&3;
  if(lv<1||!SUBJECTS[si])return null;return {si,lv,stars:[...Array(8)].map((_,i)=>(d>>(2*i))&3)}}
function toast(t){const e=h('div',{class:'toast',role:'status'},t);document.body.append(e);setTimeout(()=>e.remove(),2800)}
function modal(...kids){const m=h('div',{class:'modal',onclick(e){if(e.target===m)m.remove()}},h('div',{class:'mbox'},...kids));document.body.append(m);return m}
function showSave(){
  const ids=[...MISSIONS,FINAL].map(m=>m.id),prog=store.get(),si=SUBJECTS.findIndex(x=>x.id===T.id);
  const code=encodeCode(si,LV,ids.map(id=>prog[id]||0));
  const m=modal(h('h2',{},'Tu código secreto'),
    h('p',{class:'hint',style:'margin:0'},`${T.title} · ${LVINFO[LV].name}`),
    h('div',{class:'code'},...code.map(i=>h('span',{'aria-label':ANIMALS[i][1]},ANIMALS[i][0]))),
    h('p',{class:'codenames'},code.map(i=>ANIMALS[i][1]).join(', ')),
    h('p',{class:'hint',style:'margin:0'},'Haz una foto o apúntalo. Con estos animales recuperas las estrellas en otro móvil o tablet.'),
    h('button',{class:'next',onclick(){m.remove()}},'¡Hecho!'));
  if(canSpeak&&soundOn)speak('Tu código es: '+code.map(i=>ANIMALS[i][1]).join(', '));
}
function showLoad(){
  let picked=[];
  const slots=h('div',{class:'code empty'}),err=h('p',{class:'err',hidden:''});
  const go=h('button',{class:'next',disabled:''},'Recuperar');
  const draw=()=>{slots.innerHTML='';for(let i=0;i<6;i++){const v=picked[i];slots.append(h('span',{class:i===picked.length?'cur':''},v==null?' ':ANIMALS[v][0]))}
    go.disabled=picked.length<6;go.style.opacity=picked.length<6?.5:1;err.hidden=true};
  const zoo=h('div',{class:'zoo'});ANIMALS.forEach(([e,n],i)=>zoo.append(h('button',{'aria-label':n,onclick(){if(picked.length<6){picked.push(i);tone([520+i*20]);draw()}}},e)));
  go.onclick=()=>{const r=decodeCode(picked);
    if(!r){bad();shake(slots);err.textContent='Ese código no es correcto. Revisa los animales.';err.hidden=false;return}
    m.remove();restore(r)};
  const m=modal(h('h2',{},'Escribe tu código'),h('p',{class:'hint',style:'margin:0'},'Toca los 6 animales en orden.'),slots,zoo,err,
    h('div',{class:'saverow'},h('button',{class:'next ghost',onclick(){picked.pop();draw()}},'Borrar'),go),
    h('button',{class:'back',onclick(){m.remove()}},'Cancelar'));
  draw();
}
function restore(r){
  const s=SUBJECTS[r.si];
  if(T&&T.id===s.id){applyRestore(r);return}
  try{localStorage.setItem('nael-pendiente',JSON.stringify(r))}catch(e){}
  location.href=`base.html?a=${s.id}`;
}
function applyRestore(r){
  const ids=[...MISSIONS,FINAL].map(m=>m.id);LV=r.lv;saveLevel();
  const prog=store.get();let n=0;ids.forEach((id,i)=>{if(r.stars[i]){prog[id]=Math.max(prog[id]||0,r.stars[i])}n+=prog[id]||0});
  store.set(prog);home();confetti();tone([523,659,784,1047],.11);toast(`¡Recuperado! ${LVINFO[LV].name}: ${n} estrellas`);
}
function checkPending(){let r=null;try{r=JSON.parse(localStorage.getItem('nael-pendiente')||'null');localStorage.removeItem('nael-pendiente')}catch(e){}
  if(r&&SUBJECTS[r.si]&&SUBJECTS[r.si].id===T.id)applyRestore(r)}

/* ---------- arranque ---------- */
function registrar(t){T=t;ICONS={...HUB_ICONS,...t.icons};DIAGRAMS=t.diagrams||{};DIAG_VIEW=t.diagView||{};MISSIONS=t.missions;FINAL=t.final;loadLevel();home();checkPending()}
(function boot(){
  const s=ASIG&&SUBJECTS.find(x=>x.id===ASIG);
  if(!s){hub();return}
  const el=document.createElement('script');el.src=`temario/${s.file}`;
  el.onerror=()=>{app.innerHTML='';app.append(h('p',{class:'qtext'},'No se ha podido cargar este temario.'),h('a',{class:'back',href:'base.html'},'Volver al inicio'))};
  document.body.append(el);
})();

</script>
