<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5f8a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Juegos de Nael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: portada de cuaderno — un saludo y una tarjeta grande por asignatura */
:root{
  --bg:#f3f6ee; --card:#ffffff; --ink:#1f2b24; --muted:#5a6a60; --line:#d8dfd0; --accent:#5f8a1f;
  --medio:#d23b3b; --lengua:#2c6fd1; --mates:#e07a12;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1c2420; --ink:#e6efe8; --muted:#9db0a4; --line:#2e3a33; --accent:#8cbf45;
  --medio:#ff6b6b; --lengua:#5d9bf2; --mates:#ffa24a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1c2420; --ink:#e6efe8; --muted:#9db0a4; --line:#2e3a33; --accent:#8cbf45;
  --medio:#ff6b6b; --lengua:#5d9bf2; --mates:#ffa24a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.4;
  padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;min-height:100vh}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,11vw,60px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{margin:6px 0 0;font-size:20px;font-weight:800;color:var(--muted)}
.list{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:640px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.subj{display:flex;align-items:center;gap:16px;padding:18px;border-radius:26px;background:var(--card);border:3px solid var(--c);box-shadow:0 7px 0 var(--c);color:var(--ink);text-decoration:none;transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.subj:active{transform:translateY(6px);box-shadow:0 1px 0 var(--c)}
.subj:focus-visible{outline:3px solid var(--c);outline-offset:3px}
@media (min-width:640px){.subj{flex-direction:column;text-align:center}}
.ic{flex:none;width:80px;height:80px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.ic svg{width:46px;height:46px}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.kind{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.name{font-family:var(--f-display);font-weight:800;font-size:clamp(23px,6.4vw,27px);line-height:1.05}
.stars{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
@media (min-width:640px){.stars{justify-content:center}}
.stars svg{width:22px;height:22px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>¡Hola, <span>Nael!</span></h1>
    <p class="lead">¿Qué quieres repasar hoy?</p>
  </header>
  <nav class="list">
    <a class="subj" href="medio.html" style="--c:var(--medio)">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></span>
      <span class="tx"><span class="kind">Conocimiento del Medio</span><span class="name">La aventura del cuerpo</span><span class="stars" data-key="nael-cuerpo" data-max="24"></span></span>
    </a>
    <a class="subj" href="lengua.html" style="--c:var(--lengua)">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l4-13 4 13M4.6 14.5h4.8"/><path d="M14 6v13h3.6a3.2 3.2 0 0 0 0-6.5H14m0 0h3a3.2 3.2 0 0 0 0-6.5h-3"/></svg></span>
      <span class="tx"><span class="kind">Lengua</span><span class="name">La aventura de las letras</span><span class="stars" data-key="nael-lengua" data-max="24"></span></span>
    </a>
    <a class="subj" href="matematicas.html" style="--c:var(--mates)">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 3.5v7M3.5 7h7M14 7h7M4.5 14.5l5 5M9.5 14.5l-5 5M14 17h7"/><circle cx="17.5" cy="13.8" r=".6" fill="currentColor"/><circle cx="17.5" cy="20.2" r=".6" fill="currentColor"/></svg></span>
      <span class="tx"><span class="kind">Matemáticas</span><span class="name">La aventura de los números</span><span class="stars" data-key="nael-mates" data-max="24"></span></span>
    </a>
  </nav>
</main>
<script>
const star='<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z" fill="#ffc21a" stroke="#e09a00" stroke-width="2" stroke-linejoin="round"/></svg>';
document.querySelectorAll('.stars').forEach(el=>{
  let n=0;try{const p=JSON.parse(localStorage.getItem(el.dataset.key)||'{}');n=Object.values(p).reduce((a,b)=>a+b,0)}catch(e){}
  el.innerHTML=star+`${n} de ${el.dataset.max}`;
});
</script>
</body>
</html>
